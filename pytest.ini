[pytest]
# never collect vendored book code under docs/ or scratch under .tmp/
testpaths = tests
markers =
    live_db: needs a reachable Postgres (docker compose up -d); skips cleanly if down.
    live_net: needs a reachable network peer (neo4j mirror, OpenRouter); skips cleanly if down.
    slow: takes noticeably longer than the rest of the suite; still runs by default.

# No default -m exclusion: the standing gate
#     pytest tests/ --ignore=tests/test_mixed_acceptance.py
# keeps running everything (measured baseline: 528 passed, 6 skipped) -- these
# markers only add selectability, they do not change default behavior.
#
# Pure-offline run, no Postgres/neo4j touched:
#     pytest -m "not live_db and not live_net" --ignore=tests/test_mixed_acceptance.py
